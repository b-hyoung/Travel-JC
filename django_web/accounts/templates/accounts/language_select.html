{% extends "base.html" %}

{% block title %}Travel-JC | {{ t.language_select_title }}{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="lang-wrapper">
  <div class="lang-grid only">
    {% for lang in languages %}
    <a class="lang-button" href="{% url 'language_select' %}?lang={{ lang.code }}{% if next_url %}&next={{ next_url|urlencode }}{% endif %}">{{ lang.name }}</a>
    {% endfor %}
  </div>
</div>
{% endblock %}
